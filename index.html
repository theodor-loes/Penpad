<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  :root {
    --wood1:#b07c45; --wood2:#9d6b38; --wood3:#a9753f; --glow:rgba(255,226,170,.55);
    --paper:#fbf9f3; --ink:#1b1b1f; --tray:rgba(58,36,18,.82); --tray-fg:#f3e7d3; --tray-on:#f3e7d3; --tray-on-fg:#3a2412;
  }
  @media (prefers-color-scheme: dark) {
    :root { --wood1:#5b3c20; --wood2:#4d3119; --wood3:#563820; --glow:rgba(255,190,110,.28); --tray:rgba(24,14,6,.85); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif; color: var(--tray-fg);
    background:
      radial-gradient(ellipse 70% 55% at 50% 30%, var(--glow), transparent 70%),
      repeating-linear-gradient(92deg, var(--wood1) 0 3px, var(--wood2) 3px 8px, var(--wood3) 8px 10px, var(--wood2) 10px 15px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; min-height: 100vh;
  }
  .hidden { display: none !important; }

  .paper { background: var(--paper); border-radius: 3px; position: relative;
    box-shadow: 0 1px 1px rgba(0,0,0,.25), 0 10px 22px rgba(0,0,0,.35), 0 28px 60px rgba(0,0,0,.25); }
  .paper::after { content:""; position:absolute; inset:0; pointer-events:none; border-radius:3px;
    background: linear-gradient(135deg, rgba(255,255,255,.35), transparent 40%, rgba(0,0,0,.05)); }

  #login { width: min(340px, 92vw); padding: 26px 26px 22px; color: var(--ink); }
  #login h1 { font-weight: normal; font-size: 26px; margin: 0 0 4px; }
  #login p { margin: 0 0 16px; font-size: 14px; opacity: .65; }
  #login input { width: 100%; font: inherit; padding: 9px 2px; margin-bottom: 10px; color: var(--ink);
    background: transparent; border: 0; border-bottom: 1.5px solid rgba(0,0,0,.35); outline: none; }
  #login input:focus { border-bottom-color: var(--ink); }
  #login button { margin-top: 8px; width: 100%; font: inherit; padding: 10px; cursor: pointer; border: 0; border-radius: 4px;
    background: var(--ink); color: var(--paper); }
  #err { min-height: 18px; margin-top: 10px; font-size: 13px; color: #a02818; }

  #app { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
  #sheet { width: min(760px, 100%, calc((100vh - 150px) * var(--ar, 1.333))); padding: 10px; }
  canvas { display: block; width: 100%; background: var(--paper); touch-action: none; cursor: crosshair; image-rendering: pixelated; }

  .tray { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; padding: 8px 12px;
    background: var(--tray); border-radius: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.4); backdrop-filter: blur(4px); }
  .tray .sep { width: 1px; height: 24px; background: rgba(243,231,211,.25); margin: 0 6px; }
  .tray button { width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 10px; cursor: pointer;
    background: transparent; color: var(--tray-fg); transition: background .15s; }
  .tray button:hover { background: rgba(243,231,211,.15); }
  .tray button[aria-pressed="true"] { background: var(--tray-on); color: var(--tray-on-fg); }
  .tray svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tray svg circle.dot { fill: currentColor; stroke: none; }

  #bar { display: flex; gap: 14px; align-items: center; font-size: 13px; padding: 6px 14px; border-radius: 999px; background: var(--tray); }
  .lamp { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #8a7a68; margin-right: 6px; }
  .lamp.on { background: #7fd66b; box-shadow: 0 0 8px #7fd66b; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); padding: 7px 16px; border-radius: 999px;
    background: var(--tray); font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<form id="login" class="paper" autocomplete="on">
  <h1>Desk</h1>
  <p>Sign in to your display</p>
  <input id="user" name="username" placeholder="Username" autocomplete="username" autocapitalize="none" required>
  <input id="pass" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  <div id="err"></div>
</form>

<div id="app" class="hidden">
  <div id="bar">
    <span><i class="lamp" id="lampBroker"></i><span id="tBroker">connecting</span></span>
    <span><i class="lamp" id="lampPico"></i><span id="tPico">display unknown</span></span>
  </div>
  <div id="sheet" class="paper"><canvas id="c"></canvas></div>
  <div class="tray">
    <button id="pen" aria-pressed="true" title="Pen"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    <button id="eraser" aria-pressed="false" title="Eraser"><svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l9.6-9.6a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button>
    <span class="sep"></span>
    <button class="size" data-i="0" aria-pressed="false" title="Fine"><svg viewBox="0 0 24 24"><circle class="dot" cx="12" cy="12" r="2"/></svg></button>
    <button class="size" data-i="1" aria-pressed="true" title="Medium"><svg viewBox="0 0 24 24"><circle class="dot" cx="12" cy="12" r="3.5"/></svg></button>
    <button class="size" data-i="2" aria-pressed="false" title="Thick"><svg viewBox="0 0 24 24"><circle class="dot" cx="12" cy="12" r="5.5"/></svg></button>
    <span class="sep"></span>
    <button id="undo" title="Undo"><svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg></button>
    <button id="clear" title="Clear page"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 14H6L5 6"/></svg></button>
    <span class="sep"></span>
    <button id="photo" title="Add picture"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></button>
    <button id="pastebtn" title="Paste picture"><svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg></button>
    <button id="sendimg" title="Resend to display"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
    <span class="sep"></span>
    <button id="logout" title="Sign out"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
</div>
<div id="toast"></div>

<script>
// ---- settings (the broker address is not a secret; the password is what protects the display)
const BROKER = "YOUR-ADDRESS.emqxsl.com";
const W = 320, H = 240;                    // display size; will become 800 x 480 with the new ePaper
const PAPER = "#fbf9f3", INK = "#1b1b1f", SIZES = [2, 4, 8];

const $ = id => document.getElementById(id);
const cv = $("c"); cv.width = W; cv.height = H;
document.documentElement.style.setProperty("--ar", W / H);
const ctx = cv.getContext("2d", { willReadFrequently: true });
let client = null, P = "", touched = false, everConnected = false, tool = "pen", sizeIdx = 1;
const undoStack = [];

function blank() { ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H); }
blank();
try { $("user").value = localStorage.getItem("pp_user") || ""; } catch (e) {}

function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1800); }
function rgb332(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (r>>5<<5) | (g>>5<<2) | (b>>6);
}
function send(bytes) { if (client && client.connected) client.publish(P + "cmd", bytes); }

// ---- sign in: each account has its own topic namespace, so each display is separate
$("login").addEventListener("submit", e => {
  e.preventDefault();
  const user = $("user").value.trim();
  try { localStorage.setItem("pp_user", user); } catch (e2) {}
  P = new URLSearchParams(location.search).has("legacy") ? "penpad/" : "penpad/" + user + "/"; everConnected = false; $("err").textContent = "";
  client = mqtt.connect("wss://" + BROKER + ":8084/mqtt", {
    username: user, password: $("pass").value,
    clientId: "web-" + Math.random().toString(16).slice(2, 8), reconnectPeriod: 3000
  });
  client.on("connect", () => {
    if (!everConnected) { everConnected = true; $("login").classList.add("hidden"); $("app").classList.remove("hidden"); }
    $("lampBroker").classList.add("on"); $("tBroker").textContent = "connected";
    client.subscribe([P + "evt", P + "status", P + "frame/#"]);
    if (touched) scheduleSync(500);
  });
  client.on("close", () => { $("lampBroker").classList.remove("on"); $("tBroker").textContent = "reconnecting"; });
  client.on("error", err => {
    if (!everConnected) { $("err").textContent = /not authorized|bad user/i.test(err.message) ? "Wrong username or password." : "Could not connect."; client.end(true); }
  });
  client.on("message", (topic, payload, packet) => {
    if (topic.startsWith(P + "frame/")) { restoreChunk(+topic.slice((P + "frame/").length), payload, packet.retain); return; }
    const txt = new TextDecoder().decode(payload);
    if (topic === P + "status") { const on = txt === "online"; $("lampPico").classList.toggle("on", on); $("tPico").textContent = on ? "display online" : "display offline"; }
    if (topic === P + "evt") { try { const ev = JSON.parse(txt); if (ev.down) toast("Button " + ev.btn); } catch (e3) {} }
  });
});
$("logout").onclick = () => { if (client) client.end(true); location.reload(); };

// ---- tools
function setTool(t) { tool = t; $("pen").setAttribute("aria-pressed", t === "pen"); $("eraser").setAttribute("aria-pressed", t === "eraser"); }
$("pen").onclick = () => setTool("pen"); $("eraser").onclick = () => setTool("eraser");
document.querySelectorAll(".size").forEach(b => b.onclick = () => {
  sizeIdx = +b.dataset.i; document.querySelectorAll(".size").forEach(x => x.setAttribute("aria-pressed", x === b));
});
const penColor = () => tool === "eraser" ? PAPER : INK;
const penSize = () => SIZES[sizeIdx] * (tool === "eraser" ? 3 : 1);

function snapshot() { undoStack.push(ctx.getImageData(0, 0, W, H)); if (undoStack.length > 10) undoStack.shift(); }
$("undo").onclick = () => { const s = undoStack.pop(); if (!s) return; ctx.putImageData(s, 0, 0); touched = true; scheduleSync(100); };
$("clear").onclick = () => { snapshot(); blank(); send(new Uint8Array([1, 255])); touched = true; scheduleSync(300); };

// ---- drawing: strokes stream as line segments for a live feel
let drawing = false, last = null, queue = [];
function pos(e) {
  const r = cv.getBoundingClientRect();
  return [Math.max(0, Math.min(W-1, Math.round((e.clientX - r.left) * W / r.width))),
          Math.max(0, Math.min(H-1, Math.round((e.clientY - r.top) * H / r.height)))];
}
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); snapshot(); drawing = true; touched = true; last = pos(e); seg(last, last); });
cv.addEventListener("pointermove", e => { if (!drawing) return; const p = pos(e); seg(last, p); last = p; });
cv.addEventListener("pointerup", () => { drawing = false; flush(); scheduleSync(); });
function seg(a, b) {
  ctx.strokeStyle = penColor(); ctx.lineWidth = penSize(); ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(a[0]+.5, a[1]+.5); ctx.lineTo(b[0]+.5, b[1]+.5); ctx.stroke();
  queue.push([...a, ...b]);
}
function flush() {
  while (queue.length) {
    const part = queue.splice(0, 100);
    const buf = new ArrayBuffer(3 + part.length * 8), dv = new DataView(buf);
    dv.setUint8(0, 2); dv.setUint8(1, rgb332(penColor())); dv.setUint8(2, penSize());
    part.forEach((s, i) => s.forEach((v, j) => dv.setUint16(3 + i*8 + j*2, v, true)));
    send(new Uint8Array(buf));
  }
}
setInterval(flush, 40);

// ---- saved drawing: stored on the broker as retained messages (chunks of 16 rows)
const synced = {}; let syncTimer = null;
function scheduleSync(ms = 1000) { clearTimeout(syncTimer); syncTimer = setTimeout(() => syncFrames(false), ms); }
function syncFrames(force) {
  if (!client || !client.connected) return;
  const d = ctx.getImageData(0, 0, W, H).data;
  for (let n = 0; n < H / 16; n++) {
    const chunk = new Uint8Array(16 * W);
    for (let i = 0; i < 16 * W; i++) { const p = (n*16*W + i) * 4; chunk[i] = (d[p]>>5<<5) | (d[p+1]>>5<<2) | (d[p+2]>>6); }
    const old = synced[n];
    if (!force && old && old.every((v, i) => v === chunk[i])) continue;
    synced[n] = chunk;
    client.publish(P + "frame/" + n, chunk, { retain: true, qos: 1 });
  }
}
function restoreChunk(n, bytes, retained) {
  if (bytes.length !== 16 * W || n < 0 || n >= H / 16) return;
  synced[n] = new Uint8Array(bytes);
  if (!retained || touched) return;
  const img = ctx.createImageData(W, 16);
  for (let i = 0; i < 16 * W; i++) { const v = bytes[i]; img.data.set([(v>>5)*255/7, ((v>>2)&7)*255/7, (v&3)*255/3, 255], i * 4); }
  ctx.putImageData(img, 0, n * 16);
}
$("sendimg").onclick = () => { syncFrames(true); toast("Sent to display"); };
window.addEventListener("pagehide", () => syncFrames(false));

// ---- pictures: Ctrl+V, paste button, or file / camera
async function loadImage(blob) {
  const bmp = await createImageBitmap(blob);
  const s = Math.min(W / bmp.width, H / bmp.height), w = bmp.width*s, h = bmp.height*s;
  snapshot(); blank();
  ctx.drawImage(bmp, (W-w)/2, (H-h)/2, w, h);
  touched = true; scheduleSync(300);
}
document.addEventListener("paste", e => { const it = [...e.clipboardData.items].find(i => i.type.startsWith("image/")); if (it) loadImage(it.getAsFile()); });
$("pastebtn").onclick = async () => {
  try {
    for (const it of await navigator.clipboard.read()) {
      const t = it.types.find(x => x.startsWith("image/"));
      if (t) { await loadImage(await it.getType(t)); return; }
    }
    toast("No picture on the clipboard");
  } catch (e) { toast("Clipboard blocked here, use the picture button"); }
};
$("photo").onclick = () => $("file").click();
$("file").onchange = e => { if (e.target.files[0]) loadImage(e.target.files[0]); e.target.value = ""; };
</script>
</body>
</html>
